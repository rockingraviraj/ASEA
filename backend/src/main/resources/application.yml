server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: asea-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/asea}
    username: ${DATABASE_USERNAME:asea}
    password: ${DATABASE_PASSWORD:asea}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.asea: ${LOG_LEVEL:INFO}

asea:
  security:
    jwt-secret: ${JWT_SECRET:}
    api-key: ${API_KEY:}
    tenant-id: ${ASEA_TENANT_ID:default-tenant}
  limits:
    max-task-attributes: 50
    max-evidence-items: 200
